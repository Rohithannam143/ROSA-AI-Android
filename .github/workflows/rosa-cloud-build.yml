name: ROSA Android Cloud Build

on:
  workflow_dispatch:
  push:
    branches: [main, master, rosa-2.0-engineering]

permissions:
  contents: read

concurrency:
  group: rosa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and validate Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify and extract supplied project
        run: |
          set -euo pipefail
          unzip -t ROSA_AI_Redmi_A4_5G_Mobile_Cloud_Build.zip
          mkdir -p workspace
          unzip -q ROSA_AI_Redmi_A4_5G_Mobile_Cloud_Build.zip -d workspace
          test -f workspace/ROSA_AI_Android/app/build.gradle.kts
          test -f workspace/ROSA_AI_Android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("workspace/ROSA_AI_Android/app/build.gradle.kts")
          s = p.read_text()
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              block = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
              if "android {" not in s:
                  raise SystemExit("Android Gradle block missing")
              s = s.replace("android {", "android {\\n" + block, 1)
              p.write_text(s)
          PY
      - name: Run unit tests, lint and debug build
        working-directory: workspace/ROSA_AI_Android
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug
      - name: Upload APK and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROSA-engineering-validation
          path: |
            workspace/ROSA_AI_Android/app/build/outputs/apk/debug/*.apk
            workspace/ROSA_AI_Android/app/build/reports/lint-results-debug.html
            workspace/ROSA_AI_Android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
