name: ROSA Android Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - rosa-2.0-engineering

permissions:
  contents: read

concurrency:
  group: rosa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and validate Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify and extract supplied project
        run: |
          set -euo pipefail
          test -f ROSA_AI_Redmi_A4_5G_Mobile_Cloud_Build.zip
          unzip -t ROSA_AI_Redmi_A4_5G_Mobile_Cloud_Build.zip
          mkdir -p workspace
          unzip -q ROSA_AI_Redmi_A4_5G_Mobile_Cloud_Build.zip -d workspace
          test -f workspace/ROSA_AI_Android/app/build.gradle.kts
          test -f workspace/ROSA_AI_Android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("workspace/ROSA_AI_Android/app/build.gradle.kts")
          s = p.read_text()
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              marker = "    kotlinOptions {"
              block = "    compileOptions {\\n        sourceCompatibility = JavaVersion.VERSION_17\\n        targetCompatibility = JavaVersion.VERSION_17\\n    }\\n"
              if marker not in s:
                  raise SystemExit("Could not locate kotlinOptions block to align JVM targets")
              p.write_text(s.replace(marker, block + marker, 1))
          PY

      - name: Run unit tests, lint and debug build
        working-directory: workspace/ROSA_AI_Android
        run: |
          gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROSA-engineering-validation
          path: |
            workspace/ROSA_AI_Android/app/build/outputs/apk/debug/*.apk
            workspace/ROSA_AI_Android/app/build/reports/lint-results-debug.html
            workspace/ROSA_AI_Android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
